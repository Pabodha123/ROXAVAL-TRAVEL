<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roxaval Travels | Sri Lanka Tours &amp; Custom Itineraries</title>
    <meta name="description" content="Roxaval Travels crafts fully personalized Sri Lanka tours — curated packages, custom itineraries, hotels, guides and transport, planned and booked in one place." />
    <style>
      /* Shown immediately (before the JS bundle parses) so the first paint
         is branded rather than a blank white page; index.tsx fades and
         removes it once the app has actually mounted. */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f3d2e;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader.app-loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-loader-badge {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: #c8a24c;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.5);
      }
      .app-loader-badge img {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }
      .app-loader-title {
        margin: 20px 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 24px;
        color: #ffffff;
        letter-spacing: 0.02em;
      }
      .app-loader-bar {
        margin-top: 18px;
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .app-loader-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #c8a24c, #dbbb6f);
        animation: app-loader-sweep 1.1s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader-bar-fill {
          animation: none;
          width: 100%;
        }
      }
      @keyframes app-loader-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="app-loader-badge">
        <img src="/roxaval-icon.png" alt="" />
      </div>
      <p class="app-loader-title">Roxaval Travels</p>
      <div class="app-loader-bar"><div class="app-loader-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
